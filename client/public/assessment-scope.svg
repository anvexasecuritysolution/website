<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="340" viewBox="0 0 1080 340" role="img" aria-labelledby="title desc">
  <title id="title">Four connected areas of a security assessment</title>
  <desc id="desc">A web application connects to its API, servers and network. An agreed assessment scope defines which components, permissions and integrations can be tested. This is a schematic, not a client environment.</desc>
  <style>
    .scope-boundary{animation:scope-flow 16s linear infinite}
    .scope-links{stroke-dasharray:8 5;animation:scope-flow 3s linear infinite}
    .scope-nodes rect{animation:scope-highlight 12s ease-in-out infinite}
    .scope-nodes rect:nth-child(2){animation-delay:3s}
    .scope-nodes rect:nth-child(3){animation-delay:6s}
    .scope-nodes rect:nth-child(4){animation-delay:9s}
    @keyframes scope-flow{to{stroke-dashoffset:-52}}
    @keyframes scope-highlight{0%,28%,100%{stroke:#3e647c;fill:#162840}8%,20%{stroke:#00d4e8;fill:#153b4b}}
    @media(prefers-reduced-motion:reduce){.scope-boundary,.scope-links,.scope-nodes rect{animation:none}}
  </style>
  <rect width="1080" height="340" rx="24" fill="#0e1f35"/>
  <rect class="scope-boundary" x="24" y="24" width="1032" height="292" rx="18" fill="none" stroke="#00d4e8" stroke-opacity=".45" stroke-dasharray="7 6"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#e0eaf4" text-anchor="middle">
    <text x="540" y="64" font-size="24" font-weight="600">Your agreed testing scope</text>
    <g stroke="#00d4e8" stroke-width="2" fill="none"><path class="scope-links" d="M244 164H292m198 0h48m198 0h48"/><path d="m282 157 10 7-10 7m246-14 10 7-10 7m246-14 10 7-10 7"/></g>
    <g class="scope-nodes" fill="#162840" stroke="#3e647c"><rect x="48" y="105" width="196" height="118" rx="12"/><rect x="294" y="105" width="196" height="118" rx="12"/><rect x="540" y="105" width="196" height="118" rx="12"/><rect x="786" y="105" width="246" height="118" rx="12"/></g>
    <g font-size="21" font-weight="600"><text x="146" y="151">Web application</text><text x="392" y="151">API</text><text x="638" y="151">Servers</text><text x="909" y="151">Network</text></g>
    <g font-size="14" fill="#a9bfd0"><text x="146" y="184">User journeys &amp; roles</text><text x="392" y="184">Access &amp; data exposure</text><text x="638" y="184">Services &amp; configuration</text><text x="909" y="184">Exposure &amp; access boundaries</text></g>
    <text x="540" y="271" font-size="18" fill="#a9bfd0">Agree scope → Assess → Support remediation → Retest → Report</text>
    <text x="540" y="296" font-size="14" fill="#a9bfd0">Illustrative architecture. Components and testing depth vary by engagement.</text>
  </g>
</svg>
