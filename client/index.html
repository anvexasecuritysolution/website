<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07111F" />
  <meta name="color-scheme" content="dark" />
  <script>
    try {
      var entry = document.cookie.split(';').map(function (part) { return part.trim(); }).find(function (part) { return part.indexOf('anvexa_consent=') === 0; });
      var consent = entry ? JSON.parse(decodeURIComponent(entry.slice('anvexa_consent='.length))) : null;
      var now = Date.now();
      var allowed = consent && consent.version === 2 && typeof consent.analytics === 'boolean' && consent.necessary === true && consent.preferences === true && Number.isFinite(consent.savedAt) && now - consent.savedAt < 180 * 86400000 && consent.savedAt <= now + 60000;
      if (!allowed) localStorage.removeItem('anvexa-theme');
      else if (localStorage.getItem('anvexa-theme') === 'light') {
        document.documentElement.dataset.theme = 'light';
        document.querySelector('meta[name="theme-color"]').content = '#F3F7FB';
        document.querySelector('meta[name="color-scheme"]').content = 'light';
      }
    } catch (e) { try { localStorage.removeItem('anvexa-theme'); } catch (ignored) {} }
  </script>
  <style>html,body{background:#07111F;color:#E0EAF4;color-scheme:dark}html[data-theme="light"],html[data-theme="light"] body{background:#F3F7FB;color:#0B1B2E;color-scheme:light}</style>
  <title>Anvexa Security Solutions — Cybersecurity for Indian Businesses</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/fonts/roboto-slab-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/roboto-slab-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <script>document.documentElement.classList.add('js')</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
